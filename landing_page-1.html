<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gender Selection</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
  body{
    background:#f1f7f6;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px 14px;
    color:#111;
  }
  .page{
    width:min(100%,760px);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .card{
    width:100%;
    background:#fff;
    border-radius:34px;
    padding:42px 48px 38px;
    box-shadow:0 8px 30px rgba(31,86,78,.10);
  }
  .progress{
    width:100%;
    height:16px;
    background:#e6eceb;
    border-radius:999px;
    overflow:hidden;
    margin:0 0 58px;
  }
  .progress span{
    display:block;
    width:50%;
    height:100%;
    background:#08b58d;
    border-radius:999px;
  }
  .step{
    display:inline-block;
    background:#effaf7;
    color:#08a982;
    font-weight:800;
    font-size:20px;
    letter-spacing:.4px;
    padding:10px 18px;
    border-radius:9px;
    margin-bottom:22px;
  }
  h1{
    text-align:center;
    font-size:38px;
    line-height:1.22;
    margin:0 0 52px;
    font-weight:800;
  }
  .option{
    width:100%;
    min-height:116px;
    border:2px solid #edf0ef;
    border-radius:24px;
    background:#fff;
    display:flex;
    align-items:center;
    padding:0 30px;
    margin-bottom:26px;
    cursor:pointer;
    transition:.15s ease;
  }
  .option:hover,.option.selected{
    border-color:#b9e9dc;
    box-shadow:0 4px 14px rgba(8,181,141,.08);
  }
  .emoji{
    font-size:32px;
    width:66px;
    text-align:center;
    margin-right:20px;
  }
  .label{
    flex:1;
    font-size:30px;
    font-weight:700;
  }
  .arrow{
    font-size:38px;
    color:#708084;
    line-height:1;
  }
  .apply{
    width:100%;
    min-height:108px;
    border:0;
    border-radius:24px;
    background:#08b58d;
    color:#fff;
    font-size:31px;
    font-weight:800;
    cursor:pointer;
    margin-top:4px;
    box-shadow:none;
  }
  .apply:active{transform:scale(.99)}
  .bolt{font-size:28px;margin-left:7px}
  .secure{
    text-align:center;
    color:#b7c0c0;
    font-size:20px;
    margin-top:34px;
  }
  .lock{font-size:25px;margin-right:7px}
  @media (max-width:600px){
    body{padding:0;background:#f1f7f6}
    .page{min-height:100vh}
    .card{
      width:100%;
      border-radius:32px;
      padding:28px 24px 30px;
    }
    .progress{height:14px;margin-bottom:48px}
    .step{font-size:17px;padding:8px 14px;margin-bottom:20px}
    h1{font-size:30px;margin-bottom:42px}
    .option{min-height:92px;padding:0 20px;border-radius:21px;margin-bottom:20px}
    .emoji{font-size:27px;width:48px;margin-right:14px}
    .label{font-size:25px}
    .arrow{font-size:32px}
    .apply{min-height:88px;font-size:26px;border-radius:21px}
    .secure{font-size:17px;margin-top:28px}
  }
</style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="progress"><span></span></div>

      <div class="step">STEP 1 OF 2</div>

      <h1>Select your gender to<br>begin:</h1>

      <div class="option" data-gender="Male" role="button" tabindex="0">
        <div class="emoji">👨</div>
        <div class="label">Male</div>
        <div class="arrow">→</div>
      </div>

      <div class="option" data-gender="Female" role="button" tabindex="0">
        <div class="emoji">👩</div>
        <div class="label">Female</div>
        <div class="arrow">→</div>
      </div>

      <button class="apply" id="apply">Apply Now <span class="bolt">⚡</span></button>

      <div class="secure"><span class="lock">🔒</span>Safe &amp; Encrypted Connection</div>
    </section>
  </main>

<script>
  let selected = null;
  document.querySelectorAll('.option').forEach(option=>{
    const choose=()=>{
      selected=option.dataset.gender;
      document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));
      option.classList.add('selected');
    };
    option.addEventListener('click',choose);
    option.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' ') {e.preventDefault();choose();}
    });
  });
  document.getElementById('apply').addEventListener('click',()=>{
    if(!selected){
      alert('Please select your gender first.');
      return;
    }
    alert('Selected: '+selected);
  });
</script>
</body>
</html>
